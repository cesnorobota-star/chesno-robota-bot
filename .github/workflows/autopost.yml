name: Автопостинг Threads

on:
  schedule:
    # щогодини запускає (або ставить у чергу) робочий цикл; цикл сам працює лише 07:00-23:00 за Києвом
    - cron: "17 * * * *"
    # щоденна перевірка токена
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Лише показати, що буде опубліковано (один прохід)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    if: github.event.schedule != '5 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Цикл публікацій (кожні 3 хв, до 5 год 40 хв)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TIMEZONE: Europe/Kyiv
          MAX_POSTS_PER_DAY: "5"
          MIN_GAP_MINUTES: "90"
          SELF_REPLY_DELAY_MINUTES: "3-10"
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then echo "Немає секрету THREADS_ACCESS_TOKEN"; exit 1; fi
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            hour=$(TZ=Europe/Kyiv date +%H)
            if [ "$hour" -lt 7 ] || [ "$hour" -ge 23 ]; then echo "Поза робочими годинами ($hour:00 Київ), завершую."; break; fi
            git pull -q --rebase || true
            python autopost.py run $DRY || echo "autopost завершився з помилкою"
            if ! git diff --quiet posts_queue.csv; then
              git add posts_queue.csv
              git commit -qm "autopost: оновлено чергу"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            [ -n "$DRY" ] && break
            sleep 180
          done

  token-check:
    # щодня о 06:05 UTC перевіряє, що токен живий; якщо ні, GitHub надішле лист про збій
    if: github.event.schedule == '5 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Перевірка токена Threads
        env:
          T: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          curl -sf "https://graph.threads.net/v1.0/me?fields=username&access_token=$T" > /dev/null \
            || { echo "Токен Threads недійсний. Згенеруйте новий і оновіть секрет THREADS_ACCESS_TOKEN."; exit 1; }
